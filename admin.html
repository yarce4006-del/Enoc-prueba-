<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ENOC · Panel de gestión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0B1C38;--blue:#145DFF;--bg:#F3F6FC;--card:#fff;--ink:#111D36;--mute:#71809B;--ok:#10B981;--bad:#EF4444;--line:#E3E9F4;--r:16px;--side:232px;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:22px 14px}
.brand{font-size:26px;font-weight:800;letter-spacing:.5px;padding:0 10px}
.brand small{display:block;font-size:10px;font-weight:500;letter-spacing:1.5px;color:#8FA3C7;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:28px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#C9D5EC;font-size:15px;text-align:left;min-height:44px}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:#1B3A78;color:#fff}
.nav svg{width:20px;height:20px;flex:none}
.who{margin-top:auto;font-size:13px;color:#C9D5EC;padding:12px 10px;border-top:1px solid rgba(255,255,255,.12)}
.who b{display:block;color:#fff;font-size:13px}
.who button{color:#8FA3C7;font-size:12px;padding:6px 0;min-height:44px}
.main{margin-left:var(--side);min-height:100%}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top input{flex:1;max-width:420px;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg);font:inherit}
.top .sp{flex:1}
.pill{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--bg);color:var(--mute)}
.content{padding:26px 28px 40px;max-width:1200px}
h1{font-size:26px;letter-spacing:-.3px}
.lead{color:var(--mute);margin-top:4px;font-size:14px}
.date{color:var(--mute);font-size:13px;margin-top:2px;text-transform:capitalize}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(11,28,56,.05),0 6px 18px rgba(11,28,56,.05)}
.k{display:flex;flex-direction:column;gap:6px;min-width:0}
.k .ic{width:38px;height:38px;border-radius:11px;background:#EAF0FF;color:var(--blue);display:grid;place-items:center}
.k .ic svg{width:20px;height:20px}
.k.warn .ic{background:#FEECEC;color:var(--bad)}
.k .lab{font-size:13px;color:var(--mute);margin-top:4px}
.k .val{font-size:26px;font-weight:750;letter-spacing:-.5px}
.k .val.na{color:var(--mute);font-weight:600}
.k .note{font-size:12px;color:var(--mute);min-height:15px}
.k a,.k button.lnk{font-size:13px;color:var(--blue);font-weight:600;text-align:left;min-height:28px;display:inline-flex;align-items:center}
.cat{margin-top:16px;background:linear-gradient(120deg,var(--navy),#14346B);color:#fff;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cat h2{font-size:19px}
.st{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#C9D5EC}
.dot{width:9px;height:9px;border-radius:50%;background:#8FA3C7}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
h3{font-size:17px;margin:26px 0 12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;min-height:96px;font-size:14px;font-weight:600;text-align:center}
.quick .ic{width:42px;height:42px;border-radius:12px;background:#EAF0FF;color:var(--blue);display:grid;place-items:center}
.quick svg{width:22px;height:22px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.mod{display:flex;flex-direction:column;gap:6px}
.mod b{font-size:15px}.mod p{font-size:13px;color:var(--mute);flex:1}
.tag{align-self:flex-start;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.tag.use{background:#DDF6EC;color:#0A7A55}.tag.new{background:#FFF1D6;color:#8A5A00}
.banner{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FFF8E5;color:#6B4B00;font-size:13px;line-height:1.45}
.banner.err{background:#FEECEC;color:#8E1F1F}
.bnav{display:none}
.sk{background:linear-gradient(90deg,#E8EDF7,#F3F6FC,#E8EDF7);border-radius:6px;height:26px;width:90px}
/* ENOC product editor: layout inspirado fielmente en el mockup aprobado */
.product-modal-backdrop{position:fixed;inset:0;background:rgba(8,20,45,.42);backdrop-filter:blur(3px);z-index:80;display:flex;justify-content:center;align-items:center;padding:22px}
.product-modal{width:min(1320px,100%);max-height:calc(100dvh - 44px);background:#fff;border:1px solid #e1e8f5;border-radius:18px;box-shadow:0 24px 80px rgba(9,28,68,.25);display:flex;flex-direction:column;overflow:hidden}
.product-modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px;border-bottom:1px solid var(--line);flex:none}
.product-modal-head h3{margin:0;font-size:22px;letter-spacing:-.4px}.product-modal-head p{color:var(--mute);font-size:13px;margin-top:5px}
.product-modal-body{overflow:auto;padding:0;overscroll-behavior:contain;display:grid;grid-template-columns:205px minmax(0,1fr);min-height:0}
.product-editor-nav{border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.product-editor-nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:10px;color:#405273;font-size:13px;font-weight:600;min-height:44px}
.product-editor-nav button:hover{background:#f4f6ff}.product-editor-nav button.active{background:#e9eaff;color:#3538dc}
.product-editor-nav .nav-ico{display:grid;place-items:center;width:22px;height:22px;border:1px solid currentColor;border-radius:6px;font-size:12px;flex:none}
.product-editor-content{padding:22px 26px;min-width:0}.product-editor-content section{scroll-margin-top:12px}
.product-section-title{font-size:17px;font-weight:750;margin:0 0 4px}.product-section-sub{font-size:13px;color:var(--mute);margin-bottom:16px}
.product-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px 18px}.product-fields label,.model-card label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:650;color:#31415f;min-width:0}
.product-fields input,.product-fields select,.product-fields textarea,.model-card input{width:100%;min-width:0;border:1px solid #d9e2f2;border-radius:10px;background:#fff;padding:11px 12px;font:inherit;color:var(--ink);outline:none}
.product-fields input:focus,.product-fields select:focus,.product-fields textarea:focus,.model-card input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,93,255,.10)}
.product-fields textarea{min-height:78px;resize:vertical}.product-full{grid-column:1/-1}
.product-modal-foot{display:flex;align-items:center;gap:10px;padding:13px 26px;border-top:1px solid var(--line);background:rgba(255,255,255,.97);flex:none}.product-modal-foot .product-save-msg{flex:1;min-width:100px;font-size:12px;color:var(--mute)}
.model-upload-panel{border:1px dashed #9bb7fa;background:#f7f9ff;border-radius:14px;padding:16px;margin:16px 0}.model-upload-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.model-upload-row strong{display:block;font-size:14px}.model-upload-row p{font-size:12px;color:var(--mute);margin-top:4px}.model-upload-input{display:block;width:100%;margin-top:13px;border:1px solid #e0e7f4;border-radius:10px;padding:12px;background:#fff;font:inherit;font-size:13px}
.model-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.model-card{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:11px;min-width:0}.model-card .model-photo{height:145px;border-radius:9px;background:#f4f6fb;display:flex;align-items:center;justify-content:center;overflow:hidden}.model-card .model-photo img{width:100%;height:100%;object-fit:contain}.model-chip{align-self:flex-start;background:#e9edff;color:#244fe4;border-radius:7px;padding:4px 8px;font-size:11px;font-weight:700}.model-card small{font-size:11px;color:var(--mute);overflow-wrap:anywhere}.product-editor-note{padding:10px 12px;background:#f6f8fc;border-radius:9px;color:var(--mute);font-size:12px;line-height:1.45}

/* v10: los módulos reemplazan las tarjetas del dashboard y usan el área completa */
.module-page{width:100%;box-sizing:border-box}
#moduleWorkspace{width:100%;min-width:0}
/* v9: ventana completa para gestión de modelos y tabla de productos más ordenada */
.standalone-model-modal{box-sizing:border-box}
.standalone-model-modal .standalone-model-grid{grid-template-columns:repeat(auto-fill,minmax(205px,245px));align-items:start}
.standalone-model-modal .standalone-model-head{position:sticky;top:calc(-1 * clamp(18px,2.2vw,32px));z-index:3;background:#fff;padding:4px 0 12px;border-bottom:1px solid var(--line)}
#productsWorkspace table{width:100%;table-layout:auto}
#productsWorkspace th,#productsWorkspace td{padding:10px 8px;vertical-align:middle;white-space:nowrap}
#productsWorkspace td:nth-child(3){min-width:180px;white-space:normal}
#productsWorkspace td:last-child{min-width:275px}
#productsWorkspace td:last-child>div{display:flex!important;flex-wrap:nowrap!important;align-items:center;gap:6px!important}
#productsWorkspace td:last-child .btn{padding:9px 12px;min-height:38px;white-space:nowrap}
#productsWorkspace td:last-child [data-deletep]{color:#b42318}
@media(max-width:900px){
 .standalone-model-modal .standalone-model-grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}
 #productsWorkspace{overflow-x:auto}
 #productsWorkspace table{min-width:920px}
}
@media(max-width:600px){
 .standalone-model-modal{padding:14px}
 .standalone-model-modal .standalone-model-head{top:-14px}
 .standalone-model-modal .standalone-model-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){.product-modal-backdrop{padding:0;align-items:stretch}.product-modal{width:100%;max-height:100dvh;height:100dvh;border-radius:0}.product-modal-head{padding:16px}.product-modal-body{display:block;overflow:auto}.product-editor-nav{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:5px}.product-editor-nav button{padding:9px;font-size:12px}.product-editor-content{padding:16px}.product-modal-foot{padding:10px 16px;flex-wrap:wrap}.product-modal-foot .product-save-msg{flex-basis:100%;order:3}.product-fields{grid-template-columns:1fr;gap:12px}.product-full{grid-column:auto}.model-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.model-card .model-photo{height:105px}.model-card{padding:9px}.product-modal-head h3{font-size:19px}}
@media(min-width:701px) and (max-width:1050px){.product-modal-body{grid-template-columns:170px minmax(0,1fr)}.product-editor-content{padding:18px}.model-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
.side{display:none}.main{margin:0}
.top{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top input,.pill{display:none}.top .m-brand{display:block}
.content{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.kpis{grid-template-columns:1fr 1fr;gap:12px}
.quick{grid-template-columns:repeat(4,1fr);gap:8px}.quick button{padding:12px 4px;font-size:12px}
.mods{grid-template-columns:1fr}
.bnav{display:grid;grid-template-columns:repeat(7,minmax(42px,1fr));position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;overflow-x:auto;scrollbar-width:none}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);min-width:42px;min-height:48px;justify-content:center}
.bnav button.on{color:var(--blue);font-weight:600}.bnav svg{width:22px;height:22px}.bnav::-webkit-scrollbar{display:none}
}
.m-brand{display:none;font-weight:800;font-size:20px;color:var(--navy)}
@media(min-width:861px){.m-brand{display:none!important}}
@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}}

/* Venta manual · rediseño premium integrado */
.sale-page{display:flex;flex-direction:column;gap:14px}
.sale-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:2px}
.sale-heading h1{margin:0;font-size:30px;letter-spacing:-.035em}
.sale-heading p{margin:5px 0 0;color:var(--mute);font-size:14px}
.sale-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:18px;background:#fff;border:1px solid #e8edf6;border-radius:18px;box-shadow:0 7px 22px rgba(15,35,75,.045)}
.sale-field{display:flex;flex-direction:column;gap:7px;min-width:0;font-size:12px;color:#52627e;font-weight:650}
.sale-field input,.sale-field select,.sale-field textarea,.sale-picker select,.sale-search{width:100%;min-width:0;border:1px solid #d8e1f0;border-radius:10px;padding:11px 12px;background:#fff;color:#102347;font:inherit;font-size:13px;outline:none}
.sale-field input:focus,.sale-field select:focus,.sale-search:focus{border-color:#2764ff;box-shadow:0 0 0 3px #2764ff18}
.sale-workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:14px;align-items:stretch}
.sale-panel{background:#fff;border:1px solid #e8edf6;border-radius:18px;padding:16px;box-shadow:0 7px 22px rgba(15,35,75,.045);min-width:0}
.sale-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sale-tab{border:0;background:#f2f5fb;color:#536581;border-radius:10px;padding:10px 14px;font-weight:650;font-size:12px;cursor:pointer}
.sale-tab.active{background:#175cff;color:#fff}
.sale-filters{display:grid;grid-template-columns:minmax(130px,.8fr) minmax(160px,1.4fr);gap:10px;margin-bottom:14px}
.sale-search{font-weight:400}
.sale-product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sale-product{border:1px solid #edf0f6;border-radius:14px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 10px rgba(15,35,75,.04)}
.sale-product-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#f2f4f8}
.sale-product-placeholder{width:100%;aspect-ratio:1/1;border-radius:10px;background:linear-gradient(135deg,#f1f4f9,#e8edf6);display:grid;place-items:center;color:#91a0b7}
.sale-product-name{font-size:12px;font-weight:750;color:#102347;line-height:1.3}
.sale-product-category{font-size:11px;color:#7b8aa3;min-height:14px}
.sale-product-bottom{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap;margin-top:auto}
.sale-product-price{font-size:13px;font-weight:800}
.sale-stock{font-size:10px;padding:4px 7px;border-radius:7px;background:#dcf8e9;color:#087647;white-space:nowrap}
.sale-stock.low{background:#fff0d1;color:#9b6100}
.sale-pick{border:0;background:#175cff;color:white;border-radius:9px;padding:9px 6px;font-size:11px;font-weight:750;cursor:pointer;margin-top:3px}
.sale-pick:disabled{background:#e8edf6;color:#8996aa;cursor:not-allowed}
.sale-cart-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
.sale-cart-title h2{font-size:19px;margin:0}
.sale-cart-table{width:100%;border-collapse:collapse;font-size:12px}
.sale-cart-table th{text-align:left;background:#f3f6fc;padding:11px 8px;color:#536581;font-weight:700}
.sale-cart-table td{padding:11px 8px;border-bottom:1px solid #edf0f6;vertical-align:middle}
.sale-empty{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#71819c;gap:8px}
.sale-empty strong{color:#102347}
.sale-empty-icon{height:54px;width:54px;border-radius:50%;background:#edf3ff;color:#1760ff;display:grid;place-items:center;font-size:26px}
.sale-cart-controls{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sale-mini{border:1px solid #dbe4f3;background:#fff;border-radius:7px;min-width:25px;height:26px;color:#175cff;cursor:pointer}
.sale-remove{border:0;background:#fff0f0;color:#c33232;border-radius:7px;padding:6px;cursor:pointer}
.sale-totals{margin-top:18px;background:#f1f5fd;border-radius:13px;padding:16px}
.sale-total-line{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:13px}
.sale-grand-total{border-top:1px solid #dfe7f5;padding-top:14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:23px;font-weight:850}
.sale-grand-total b{color:#175cff}
.sale-submit{width:100%;border:0;border-radius:12px;background:#175cff;color:white;font-size:14px;font-weight:800;padding:16px;margin-top:14px;cursor:pointer}
.sale-submit:hover,.sale-pick:hover{background:#0f4ee4}
.sale-secondary{border:1px solid #dce5f5;background:#fff;color:#175cff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer}
.sale-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:#f7f9fd;padding:12px;border-radius:12px;margin-bottom:12px}
.sale-picker label{font-size:11px;color:#60708a;display:flex;flex-direction:column;gap:5px}
.sale-note{font-size:12px;color:#5c6f8e;margin:8px 0}
@media(max-width:1150px){.sale-product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sale-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.sale-workspace{grid-template-columns:1fr}.sale-product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.sale-meta{grid-template-columns:1fr}.sale-product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sale-heading h1{font-size:25px}.sale-picker{grid-template-columns:1fr}.sale-panel{padding:12px}.sale-filters{grid-template-columns:1fr}.sale-cart-table{font-size:11px}}


.sale-fullscreen{min-height:calc(100vh - 130px);padding:2px 0 28px}
.sale-fullscreen .sale-page{max-width:none}
.sale-fullscreen .sale-heading h1{font-size:30px}
.sale-model-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:12px;font-weight:750;color:#52627e}
.sale-model-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:10px 0}
.sale-model-card{border:1px solid #e1e8f4;background:#fff;border-radius:12px;padding:7px;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.sale-model-card:hover{transform:translateY(-2px);border-color:#8aabff;box-shadow:0 6px 18px #174b9914}
.sale-model-card.selected{border:2px solid #175cff;background:#f4f7ff;padding:6px;box-shadow:0 0 0 3px #175cff14}
.sale-model-card img,.sale-model-placeholder{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0f3f8;border-radius:8px}
.sale-model-placeholder{display:grid;place-items:center;color:#94a3b8;font-size:24px}
.sale-model-card b{display:block;font-size:12px;color:#142849;margin:7px 2px 3px;overflow-wrap:anywhere}
.sale-model-card span{display:block;font-size:10px;color:#667895;margin:0 2px 3px}
.sale-model-card .model-stock{color:#087647;font-weight:700}
.sale-variant-row{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:9px;align-items:end}
.sale-field.compact{font-size:11px}

async function casheaApi(path,{method="GET",body:payload}={}){

const ENOC_R2_UPLOAD_ENDPOINT = "https://enoc-r2-upload.enoc365-image-migration.workers.dev";
async function uploadImageToR2(path, file) {
  if (!ENOC_R2_UPLOAD_ENDPOINT || ENOC_R2_UPLOAD_ENDPOINT.includes("REPLACE-WITH")) {
    throw new Error("Falta configurar ENOC_R2_UPLOAD_ENDPOINT con la URL del Worker de Cloudflare.");
  }
  const { data: { session } } = await db.auth.getSession();
  if (!session?.access_token) throw new Error("Tu sesión ha caducado. Inicia sesión de nuevo.");
  const form = new FormData();
  form.append("path", path);
  form.append("file", file, file.name || "image.webp");
  const response = await fetch(ENOC_R2_UPLOAD_ENDPOINT, {
    method: "POST",
    headers: { Authorization: `Bearer ${session.access_token}` },
    body: form
  });

  if (!response.ok || !result.publicUrl) throw new Error(result.error || `Falló la subida a R2 (${response.status}).`);

}

async function loadAutomaticVatRate(){
  const input=$("vatRate"),status=$("vatRateStatus");
  if(!input)return;
  input.value="";
  input.placeholder="Consultando tasa BCV…";
  if(status)status.textContent="Consultando la tasa oficial desde Supabase…";
  try{
    // GET simple: evita preflight CORS desde el archivo local (file://).
    // La Edge Function tiene verify_jwt=false y responde con CORS abierto.
    const response=await fetch(SUPABASE_URL+"/functions/v1/super-function?t="+Date.now(),{
      method:"GET",
      mode:"cors",
      cache:"no-store"
    });
    const raw=await response.text();
    let data;
    try{data=JSON.parse(raw)}catch{throw new Error("Respuesta no válida de Supabase (HTTP "+response.status+")")}
    if(!response.ok)throw new Error("HTTP "+response.status+": "+(data.error||data.message||"No se pudo consultar la función BCV"));
    if(data.success===false)throw new Error(data.error||"La función BCV indicó un error");
    const rate=Number(data.USD);
    if(!Number.isFinite(rate)||rate<=0)throw new Error("La respuesta no contiene una tasa USD válida");
    input.value=rate.toFixed(4);
    input.title="Tasa BCV obtenida automáticamente. Vigencia: "+(data.effective_date||data.date||"fecha no informada");
    if(status)status.textContent="Tasa BCV actualizada: Bs. "+rate.toFixed(4)+" por USD · Vigencia: "+(data.effective_date||data.date||"la informada por la fuente");
  }catch(error){
    input.value="";
    input.placeholder="Tasa BCV no disponible";
    if(status)status.textContent="No se pudo consultar la tasa BCV: "+(error?.message||"error desconocido")+". Verifica la función super-function y vuelve a intentar.";
    console.error("ENOC / tasa BCV automática:",error);
  }
  input.dispatchEvent(new Event("input",{bubbles:true}));
}

function productImageLocal(p){

 if(typeof urls==="string"){try{urls=JSON.parse(urls)}catch(e){urls=[urls]}}
 return (Array.isArray(urls)?urls[0]:"")||p.image_url||"";
}
function renderSaleProductsLocal(){

 }).join("");

function modelImageLocal(m,p){
 let urls=m?.image_urls;
 if(typeof urls==="string"){try{urls=JSON.parse(urls)}catch(e){urls=[urls]}}
 if(Array.isArray(urls)){const first=urls.find(x=>typeof x==="string"&&x.trim())||"";if(first)return first}
 if(urls&&typeof urls==="object"){const first=Object.values(urls).find(x=>typeof x==="string"&&x.trim());if(first)return first}
 return productImageLocal(p||{});
}

function updateSaleSummaryLocal(){

 $("saleSummary").textContent=`${p.name} · ${m.name} · Talla ${v.size} · ${v.color||"Único"} · Stock ${v.stock} · Subtotal ${money((Number(v.price??p.price)||0)*q)}`;
}
function saleFeedbackLocal(message,isError=false){
 const e=$("saleActionFeedback");
 if(e){e.textContent=message;e.classList.toggle("error",!!isError)}
 const m=$("moduleMsg");if(m)m.textContent=isError?"":message;
}
function addSaleCartLocal(){
 try{
  const p=saleActiveProduct,m=saleModels.find(x=>String(x.id)===String($("saleModel").value)),v=saleVariants.find(x=>String(x.id)===String($("saleVariant").value)),q=Number($("saleQty").value);
  if(!p){saleFeedbackLocal("Selecciona primero un producto.",true);return}
  if(!m){saleFeedbackLocal("Selecciona un modelo en las tarjetas.",true);return}
  if(!v){saleFeedbackLocal("Selecciona una talla o color con stock.",true);return}
  if(!Number.isInteger(q)||q<1||q>Number(v.stock)){saleFeedbackLocal("La cantidad debe ser válida y no superar el stock disponible.",true);return}
  const existing=saleCart.find(x=>String(x.variant_id)===String(v.id));
  if(existing){if(existing.qty+q>Number(v.stock)){saleFeedbackLocal("No hay suficiente stock para aumentar la cantidad.",true);return}existing.qty+=q}  else saleCart.push({variant_id:v.id,product_id:p.id,product_name:p.name,model_id:m.id,model_name:m.name,size:v.size,color:v.color||"",qty:q,price:Number(v.price??p.price)||0,stock:Number(v.stock)||0});
  renderSaleCartLocal();
  saleFeedbackLocal(`✓ ${p.name} · ${m.name} agregado al carrito.`);
  $("saleQty").value="1";
  closeSalePickerLocal();
 }catch(err){saleFeedbackLocal("No se pudo agregar: "+(err?.message||err),true);console.error("ENOC add-to-cart",err)}
}
function renderSaleCartLocal(){
 const subtotal=saleCart.reduce((a,x)=>a+x.price*x.qty,0),discountPct=Math.min(100,Math.max(0,Number($("saleDiscount")?.value)||0)),discount=subtotal*discountPct/100,total=subtotal-discount;
 const isCashea=$("salePayment")?.value==="Cashea",initial=isCashea?Math.max(0,Number($("saleInitial")?.value)||0):0,salePct=isCashea?Math.max(0,Number($("saleCommissionSalePct")?.value)||0):0,financedPct=isCashea?Math.max(0,Number($("saleCommissionFinancedPct")?.value)||0):0,financed=isCashea?Math.max(0,total-initial):0,commissionSale=isCashea?total*salePct/100:0,commissionFinanced=isCashea?financed*financedPct/100:0,commission=commissionSale+commissionFinanced,net=isCashea?financed-commission:total;
 $("saleSubtotal").textContent=money(total);const commissionLine=$("saleCommissionLine");if(commissionLine)commissionLine.hidden=!isCashea;if($("saleCommission"))$("saleCommission").textContent=money(commission);if($("saleNetLabel"))$("saleNetLabel").textContent=isCashea?"Neto estimado de Cashea":"Total";if($("saleTotal"))$("saleTotal").textContent=money(isCashea?net:total);if($("salePaymentNote"))$("salePaymentNote").textContent=isCashea?"El neto estimado parte del monto financiado menos ambas comisiones. Verifica las condiciones vigentes de Cashea.":"Pago al contado. No se aplica comisión de Cashea.";if($("saleCartCount"))$("saleCartCount").textContent=String(saleCart.reduce((n,x)=>n+x.qty,0));
 const cf=$("saleCasheaFields");if(cf){cf.hidden=!isCashea;cf.style.display=isCashea?"grid":"none"}if($("saleFinanced"))$("saleFinanced").textContent=money(financed);if($("saleCommissionSale"))$("saleCommissionSale").textContent=money(commissionSale);if($("saleCommissionFinanced"))$("saleCommissionFinanced").textContent=money(commissionFinanced);if($("saleCommissionTotal"))$("saleCommissionTotal").textContent=money(commission);if($("saleInitial"))$("saleInitial").max=total.toFixed(2);
 $("saleCart").innerHTML=saleCart.length?`<div style="overflow:auto"><table class="sale-cart-table"><thead><tr><th>Producto</th><th>Modelo / talla</th><th>Precio</th><th>Cantidad</th><th>Total</th></tr></thead><tbody>${saleCart.map((x,i)=>`<tr><td><b>${esc(x.product_name)}</b></td><td>${esc(x.model_name)}<br><span style="color:#71819c">Talla ${esc(x.size)} · ${esc(x.color||"Único")}</span></td><td>${money(x.price)}</td><td><div class="sale-cart-controls"><button class="sale-mini" data-minus="${i}">−</button><b>${x.qty}</b><button class="sale-mini" data-plus="${i}">+</button><button class="sale-remove" data-remove="${i}">×</button></div></td><td><b>${money(x.price*x.qty)}</b></td></tr>`).join("")}</tbody></table></div>`:`<div class="sale-empty"><div class="sale-empty-icon">🛒</div><strong>Aún no has agregado productos</strong><span>Selecciona un producto del catálogo para agregarlo al carrito.</span></div>`;
 $("saleCart").querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>changeSaleCartLocal(+b.dataset.minus,-1));

 const initial=Number(initialAmount),safeInitial=Number.isFinite(initial)?initial:0;
 const financed=round(Math.max(0,total-safeInitial));

 return {total,initial,financed,saleCommission,financedCommission,commissionTotal:round(saleCommission+financedCommission)};
}

async function fiscalRegisterSelected(operationId){const op=fiscalOperations.find(x=>x.id===operationId);if(!op)return;const rateInput=$('fiscalManualRate'),rate=Number(rateInput?.value);if(!Number.isFinite(rate)||rate<=0){fiscalSetFeedback('Introduce la tasa BCV oficial correspondiente a la fecha de esta venta. No se aceptan tasas vacías o cero.','error');return}const rateDate=prompt('Confirma la fecha de vigencia de la tasa BCV oficial (AAAA-MM-DD):',op.sale_date||'');if(!rateDate)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(rateDate)){fiscalSetFeedback('La fecha de tasa debe tener formato AAAA-MM-DD.','error');return}if(!confirm(`Crear resguardo para ${op.operation_reference||'esta venta'} con tasa BCV ${rate} y fecha ${rateDate}? Verifica que la tasa provenga de una fuente oficial para esa fecha.`))return;try{const {data,error}=await casheaApi('/api/admin/cashea/fiscal/reserve',{method:'POST',body:{operation_id:operationId,bcv_rate:rate,rate_date:rateDate,rate_source:'Administrativa — tasa BCV verificada'}});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'No se pudo guardar el resguardo.');await loadFiscalData();fiscalSelected=operationId;fiscalSetFeedback('Resguardo fiscal registrado correctamente.','success');fiscalRender()}catch(e){fiscalSetFeedback('No se pudo registrar el resguardo: '+(e.message||e),'error')}}

 const start=$('fiscalFrom')?.value,end=$('fiscalTo')?.value;
 if(!start||!end||start>end){fiscalSetFeedback('Selecciona una fecha inicial y final válidas para declarar.','error');return}
 const pending=fiscalRows.filter(r=>r.sale_date>=start&&r.sale_date<=end&&!r.declaration_id&&r.status==='registered');
 if(!pending.length){fiscalSetFeedback('No hay resguardos pendientes de declarar dentro de ese período.','error');return}

 }catch(e){fiscalRender();fiscalSetFeedback('No se pudo registrar la declaración: '+(e.message||e),'error')}

async function loadFiscalData(){

 try{fiscalRateInfo=await fetchCurrentBcv()}catch(e){fiscalRateInfo=null}

 let orders=[],batches=[],tab='orders',page=1,pageSize=8;
 const dashMoney=(n,currency)=>{try{return new Intl.NumberFormat('en-US',{style:'currency',currency:currency||'USD'}).format(Number(n)||0)}catch{return (currency||'')+' '+(Number(n)||0).toFixed(2)}};
 const moneyByCurrency=(rows,field)=>{const sums={};rows.forEach(r=>{const c=r.currency||'USD';sums[c]=(sums[c]||0)+Number(r[field]||0)});return Object.entries(sums).map(([c,v])=>dashMoney(v,c)).join(' · ')||dashMoney(0,'USD')};
 const localDateISO=(d)=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};

 function applyQuickPeriod(kind){const now=new Date();let from=new Date(now),to=new Date(now);from.setHours(0,0,0,0);to.setHours(0,0,0,0);if(kind==='7days')from.setDate(from.getDate()-6);else if(kind==='30days')from.setDate(from.getDate()-29);else if(kind==='month')from=new Date(now.getFullYear(),now.getMonth(),1);else if(kind==='custom'){setPeriodActive('custom');return} $('cxDashFrom').value=localDateISO(from);$('cxDashTo').value=localDateISO(to);setPeriodActive(kind);page=1;updateDashboardStats();renderPane()}
 function onDateManualChange(){const f=$('cxDashFrom').value,t=$('cxDashTo').value;if(f&&t&&f>t){$('cxDashTo').value=f}$('cxDashTo').min=$('cxDashFrom').value||'';$('cxDashFrom').max=$('cxDashTo').value||'';setPeriodActive('custom');page=1;updateDashboardStats();renderPane()}
 const statusLabel=s=>({draft:'Borrador',confirmed:'Aprobada',partially_settled:'Parcialmente liquidada',settled:'Pagada',cancelled:'Cancelada',pending:'Pendiente',approved:'Aprobada',processing:'En proceso'})[s]||String(s||'Pendiente');
 const statusClass=s=>s==='settled'?'good':s==='confirmed'?'good':s==='partially_settled'?'partial':s==='cancelled'?'cancelled':s==='draft'?'pending':'progress';
 function dateScoped(rows){const from=$('cxDashFrom')?.value||'',to=$('cxDashTo')?.value||'';return rows.filter(o=>(!from||(o.sale_date||'')>=from)&&(!to||(o.sale_date||'')<=to))}
 function updateDashboardStats(){const scoped=dateScoped(orders),active=scoped.filter(o=>o.status!=='cancelled'),pending=active.filter(o=>['confirmed','partially_settled','draft'].includes(o.status));$('cxDashCount').textContent=String(pending.length);$('cxDashOrdersBadge').textContent=String(pending.length);$('cxDashPaymentsBadge').textContent=String(batches.filter(b=>{const d=b.payment_date||'';return (!($('cxDashFrom')?.value)||(d>=$('cxDashFrom').value))&&(!($('cxDashTo')?.value)||(d<=$('cxDashTo').value))}).length);$('cxDashPendingBadge').textContent=String(pending.length);$('cxDashTotal').textContent=moneyByCurrency(pending,'financed_amount');$('cxDashCommission').textContent=moneyByCurrency(pending,'estimated_commission');const sums={};pending.forEach(o=>{const c=o.currency||'USD';sums[c]=(sums[c]||0)+Math.max(0,Number(o.financed_amount||0)-Number(o.estimated_commission||0))});$('cxDashNet').textContent=Object.entries(sums).map(([c,v])=>dashMoney(v,c)).join(' · ')||dashMoney(0,'USD')}
 function filtered(){let a=[...orders];const q=($('cxDashSearch')?.value||'').trim().toLowerCase(),st=$('cxDashStatus')?.value||'',sort=$('cxDashSort')?.value||'new',from=$('cxDashFrom')?.value||'',to=$('cxDashTo')?.value||'';if(q)a=a.filter(o=>[o.operation_reference,o.customer_name,o.customer_phone,o.id].some(v=>String(v||'').toLowerCase().includes(q)));if(st)a=a.filter(o=>o.status===st);if(from)a=a.filter(o=>(o.sale_date||'')>=from);if(to)a=a.filter(o=>(o.sale_date||'')<=to);a.sort((x,y)=>{const dx=x.sale_date||x.created_at||'',dy=y.sale_date||y.created_at||'';return sort==='old'?dx.localeCompare(dy):dx<dy?1:dx>dy?-1:0});return a}

ect" aria-label="Cambiar estado de orden" data-cxd-payment-status="${esc(o.id)}"><option value="confirmed" ${o.status==='confirmed'?'selected':''}>Aprobada</option><option value="settled" ${o.status==='settled'?'selected':''}>Pagada</option></select>`:`<span class="cx-dash-status ${statusClass(o.status)}">${esc(statusLabel(o.status))}</span>`}</td><td>${esc(o.sale_date||'—')}<span class="cx-dash-muted">${esc(o.created_at?new Date(o.created_at).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'}):'')}</span></td><td><div class="cx-dash-actions"><button class="cx-dash-iconbtn" title="Ver detalle" data-cxd-detail="${esc(o.id)}">⌕</button><button class="cx-dash-iconbtn" title="Ver información de orden" data-cxd-detail="${esc(o.id)}">▤</button></div></td></tr>`}).join('')}</tbody></table>${shown.length?'':'<div class="cx-dash-empty">No hay órdenes que coincidan con los filtros.</div>'}</div><div class="cx-dash-footer"><span>Mostrando ${list.length?((page-1)*pageSize+1):0}–${Math.min(page*pageSize,list.length)} de ${list.length} órdenes</span><div class="cx-dash-pages"><button data-cxd-page="prev" ${page<=1?'disabled':''}>‹</button>${Array.from({length:pages},(_,i)=>i+1).slice(Math.max(0,page-2),Math.min(pages,Math.max(3,page+1))).map(n=>`<button class="${n===page?'active':''}" data-cxd-page="${n}">${n}</button>`).join('')}<button data-cxd-page="next" ${page>=pages?'disabled':''}>›</button></div></div><div id="cxDashDetail"></div>`;
  ['cxDashSearch','cxDashStatus','cxDashSort'].forEach(id=>$(id)?.addEventListener(id==='cxDashSearch'?'input':'change',()=>{page=1;renderPane()}));pane.querySelectorAll('[data-cxd-page]').forEach(b=>b.onclick=()=>{const v=b.dataset.cxdPage;page=v==='prev'?Math.max(1,page-1):v==='next'?page+1:Number(v);renderPane()});pane.querySelectorAll('[data-cxd-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.cxdDetail));

    // Reversión explícita: permite corregir un pago marcado por error.

    if(order.status==='settled' && sel.value==='confirmed'){
      const reason=prompt('Motivo para devolver la orden a Aprobada:', 'Pago marcado por error; Cashea aún no ha depositado');
      if(reason===null){renderPane();return}
      if(!confirm('¿Revertir el pago registrado para '+(order.operation_reference||order.id)+'? La orden volverá a Aprobada y los cuatro indicadores la incluirán otra vez. Esta acción no debe usarse si Cashea ya depositó realmente.')){renderPane();return}
      sel.disabled=true;

        if(error)throw error;
        if(!data||data.ok!==true)throw new Error(data?.message||'No se pudo revertir el pago.');

      dateParts=paymentDateRaw.split('-').map(Number);
    }else{
      const dateMatch=paymentDateRaw.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);

        else if(second>12){month=first;day=second}
        else {month=first;day=second}

      }
    }

      const [year,month,day]=dateParts;

    if(!paymentDate){alert('Fecha no válida. Usa AAAA-MM-DD o el formato de fecha de tu navegador.');renderPane();return}

    if(amountText===null){renderPane();return}
    const amount=Number(String(amountText).replace(',','.'));

    if(Math.abs(amount-net)>0.01){alert('Para marcar la orden como Pagada, el importe debe coincidir con el neto pendiente de esa orden ('+dashMoney(net,order.currency)+'). Si Cashea depositó un importe distinto, no marques esta orden como pagada con este flujo.');renderPane();return}

      const {data:rpcData,error:rpcError}=await casheaApi('/api/admin/cashea/payments/batches',{method:'POST',body:{payment_date:paymentDate,amount_received:Number(amount.toFixed(2)),currency:order.currency||'USD',reference:reference.trim()||null,operation_ids:[operationId]}});
      if(rpcError)throw rpcError;
      if(rpcData&&rpcData.ok===false)throw new Error(rpcData.message||'No se pudo registrar el depósito.');

        casheaApiQuery('/api/admin/cashea/operations'),
        casheaApiQuery('/api/admin/cashea/payments').then(data=>({data:data?.batches||[],error:null}))
      ]);

    }
  }));

 async function showExchangeForm(operationId,itemId,productName){
  const area=$('cxExchangeArea');if(!area)return;
  area.innerHTML='<div class="cx-detail-empty">Cargando modelos y tallas disponibles…</div>';
  try{
   const [{data:products,error:pe},{data:models,error:me},{data:variants,error:ve},{data:item,error:ie},{data:history,error:he}]=await Promise.all([
    db.from('products').select('id,name,sku').order('name'),
    db.from('product_models').select('id,product_id,name,image_urls').eq('active',true).order('name'),
    db.from('product_model_variants').select('id,model_id,size,color,stock,price,active').eq('active',true).gt('stock',0),
    casheaApiQuery('/api/admin/cashea/items?operation_id='+encodeURIComponent(operationId)).then(r=>({data:(r.data||[]).find(x=>String(x.id)===String(itemId))||null,error:null})),
    db.from('cashea_item_exchanges').select('to_variant_id').eq('operation_item_id',itemId).order('created_at',{ascending:false}).limit(1)
   ]);
   if(pe)throw pe;if(me)throw me;if(ve)throw ve;if(ie)throw ie;if(he)throw he;
   const currentVariantId=history?.[0]?.to_variant_id||item.variant_id;
   const available=(variants||[]).map(v=>{const m=(models||[]).find(x=>String(x.id)===String(v.model_id));const p=(products||[]).find(x=>String(x.id)===String(m?.product_id));return {...v,modelName:m?.name||'Modelo',productName:p?.name||'Producto',productId:p?.id}}).filter(v=>v.productId&&String(v.id)!==String(currentVariantId));
   if(!available.length)throw new Error('No hay otras variantes activas con stock disponible para realizar el cambio.');
   area.innerHTML=`<div class="cx-exchange-form"><div class="cx-exchange-form-title">Cambio de prenda o talla · ${esc(productName)}</div><div class="cx-exchange-form-subtitle">Se cambiarán ${esc(item.quantity)} unidad(es) de la orden. El inventario se actualizará al confirmar.</div><label>Producto nuevo<select id="cxExchangeVariant" required><option value="">Selecciona una variante disponible</option>${available.map(v=>`<option value="${esc(v.id)}">${esc(v.productName)} · ${esc(v.modelName)} · Talla ${esc(v.size)} · ${esc(v.color||'Único')} · Stock ${esc(v.stock)}</option>`).join('')}</select></label><label>Motivo del cambio<input id="cxExchangeReason" maxlength="240" placeholder="Ej. Cambio de modelo o talla" required /></label><p class="cx-exchange-note">Al confirmar, se devolverá al inventario la variante actual y se descontará la nueva. Ambas actualizaciones y el registro del historial se guardan en una sola transacción. La orden y su importe original no se modifican.</p><div class="cx-exchange-actions"><button class="cx-detail-btn" type="button" id="cxExchangeCancel">Cancelar</button><button class="cx-detail-btn primary" type="button" id="cxExchangeConfirm">Confirmar cambio</button></div><div id="cxExchangeFeedback" class="cx-exchange-feedback" role="status" aria-live="polite"></div></div>`;
   $('cxExchangeCancel').onclick=()=>area.innerHTML='';
   $('cxExchangeConfirm').onclick=async()=>{
    const button=$('cxExchangeConfirm'),feedback=$('cxExchangeFeedback');
    const selected=available.find(x=>String(x.id)===$('cxExchangeVariant').value),reason=$('cxExchangeReason').value.trim();
    if(!selected){feedback.textContent='Selecciona la nueva prenda, modelo o talla.';return}
    if(!reason){feedback.textContent='Escribe el motivo del cambio.';$('cxExchangeReason').focus();return}
    if(!confirm(`¿Confirmar el cambio de ${item.quantity} unidad(es)?\n\nPrenda nueva: ${selected.productName} · ${selected.modelName} · talla ${selected.size} · ${selected.color||'Único'}\nStock actual: ${selected.stock}\nMotivo: ${reason}\n\nSe devolverá la variante actual y se descontará esta nueva variante.`))return;
    button.disabled=true;button.textContent='Registrando cambio…';feedback.textContent='Actualizando inventario e historial de forma segura…';
    try{
     const {data,error}=await casheaApi('/api/admin/cashea/exchange',{method:'POST',body:{operation_id:operationId,item_id:itemId,new_variant_id:selected.id,reason}});
     if(error)throw error;
     feedback.textContent=data?.message||'Cambio registrado correctamente.';
     await showDetail(operationId);
    }catch(err){button.disabled=false;button.textContent='Confirmar cambio';feedback.textContent='No se registró el cambio: '+(err?.message||String(err));}
   };

const dayKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`};
function setVal(id,text,note,na){const e=$(id);e.textContent=text;e.classList.toggle("na",!!na);$(id+"N").textContent=note||""}

async function loadHome(){
  const errs=[];
  const [o,v,cx]=await Promise.all([
    db.from("orders").select("id,status,total,created_at,customer_data").order("created_at",{ascending:false}).limit(1000),
    db.from("product_model_variants").select("id,stock,active"),
    db.from("cashea_operations").select("id,sale_total,currency,sale_date,status,created_at").order("created_at",{ascending:false}).limit(1000)
  ]);
  // Pedidos
  if(o.error){errs.push("pedidos: "+o.error.message);["kSales","kPend"].forEach(i=>setVal(i,"—","No disponible",true))}
  else{
    const rows=o.data||[];
    // Una solicitud web convertida en venta genera otro pedido: se cuenta solo el pedido resultante.
    const converted=new Set(rows.map(r=>r.customer_data?.source_request_id).filter(Boolean));
    const today=dayKey(new Date());
    const sold=rows.filter(r=>SOLD_STATUSES.includes(r.status)&&!converted.has(r.id)&&dayKey(r.created_at)===today);
    const regularTotal=sold.reduce((s,r)=>s+Number(r.total||0),0);
    setVal("kSales",money(regularTotal),`${sold.length} venta(s) regular(es)`);
    setVal("kPend",String(rows.filter(r=>PENDING_STATUSES.includes(r.status)&&!converted.has(r.id)).length),"Por verificar o confirmar");
    if(cx.error){errs.push("Cashea: "+cx.error.message);setVal("kCasheaSales","—","No disponible",true);setVal("kTotalSales","—","No disponible",true)}
    else{
      const cxRows=(cx.data||[]).filter(r=>r.status!=="cancelled"&&dayKey(r.sale_date||r.created_at)===today);
      const byCurrency=(values)=>{const totals=new Map();values.forEach(r=>{const cur=r.currency||"USD";totals.set(cur,(totals.get(cur)||0)+Number(r.sale_total||0))});return [...totals].map(([cur,total])=>new Intl.NumberFormat("es-VE",{style:"currency",currency:cur}).format(total)).join(" · ")||money(0)};
      setVal("kCasheaSales",byCurrency(cxRows),`${cxRows.length} operación(es) Cashea`);
      // Total combina ventas regulares (orders) y ventas Cashea. Canceladas se excluyen.
      const totalByCurrency=new Map();
      sold.forEach(r=>{const cur=(r.customer_data?.currency||"USD");totalByCurrency.set(cur,(totalByCurrency.get(cur)||0)+Number(r.total||0))});
      cxRows.forEach(r=>{const cur=r.currency||"USD";totalByCurrency.set(cur,(totalByCurrency.get(cur)||0)+Number(r.sale_total||0))});
      const totalText=[...totalByCurrency].map(([cur,total])=>new Intl.NumberFormat("es-VE",{style:"currency",currency:cur}).format(total)).join(" · ")||money(0);
      setVal("kTotalSales",totalText,"Ventas regulares + Cashea, sin canceladas");
    }
  }
  // Stock bajo
  if(v.error){errs.push("stock: "+v.error.message);setVal("kLow","—","No disponible",true)}
  else{
    const low=(v.data||[]).filter(x=>x.active!==false&&Number(x.stock||0)<=LOW_STOCK).length;
    setVal("kLow",String(low),`Variantes con ${LOW_STOCK} o menos unidades`);
  }
  // Ganancia: no hay costos en la base de datos todavía, por eso no se inventa una cifra.
  setVal("kProfit","—","Sin costos registrados aún (llega con Herramientas)",true);
  // Estado del catálogo: lo único verificable hoy es si los datos del catálogo responden.
  const c=await db.from("store_settings").select("id").limit(1);
  const ok=!c.error;
  $("catDot").className="dot "+(ok?"ok":"bad");
  $("catTxt").textContent=ok?"Datos del catálogo conectados":"No se pudo verificar el catálogo";
  if(c.error)errs.push("catálogo: "+c.error.message);
  $("conn").textContent=errs.length?"Con errores":"Conectado";
  if(errs.length)$("homeErr").innerHTML=`<div class="banner err">No se pudo leer: ${esc(errs.join(" · "))}. Revisa la sesión y las políticas de acceso en Supabase.</div>`;
}

/* ---------- Notificaciones push ENOC ---------- */
function enocUrlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64); const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
async function setupENOCPush(session, askPermission=true){
  const btn=document.getElementById('enocPushBtn');
  const label=(t)=>{if(btn)btn.textContent=t};
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    label('⚠️ Push no compatible'); return false;
  }
  if(!/^https:/.test(location.protocol) && location.hostname!=='localhost'){
    label('⚠️ Publicar en HTTPS');
    if(btn){
      btn.title='Las notificaciones push no funcionan al abrir admin.html como archivo local. Publica los archivos en un sitio HTTPS y vuelve a activarlas.';
      btn.setAttribute('aria-label','Notificaciones push: requiere publicar el administrador en HTTPS');
      btn.textContent='⚠️ Requiere HTTPS';
      let help=document.getElementById('enocPushHttpsHelp');
      if(!help){
        help=document.createElement('div');
        help.id='enocPushHttpsHelp';
        help.setAttribute('role','status');
        help.style.cssText='position:fixed;right:18px;top:112px;z-index:99999;max-width:360px;padding:12px 15px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);font:13px/1.5 system-ui,sans-serif';
        help.textContent='Para activar las notificaciones de pedidos, publica index.html, admin.html, login.html y sw.js en el mismo sitio con HTTPS. Abrir el archivo desde el disco (C:/ o file://) no permite activar Push.';
        document.body.appendChild(help);
      }
    }
    return false;
  }
  try{
    if(askPermission && Notification.permission==='default'){
      const p=await Notification.requestPermission(); if(p!=='granted'){label('🔔 Permitir notificaciones');return false;}
    }
    if(Notification.permission!=='granted'){label('🔔 Permitir notificaciones');return false;}
    const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    await navigator.serviceWorker.ready;
    const configRes=await fetch(SUPABASE_URL+'/functions/v1/enoc-push-subscribe',{method:'GET',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+session.access_token}});
    const config=await configRes.json();
    if(!configRes.ok || !config.publicKey) throw new Error(config.error||'No se pudo obtener la clave pública VAPID del servidor');
    let subscription=await reg.pushManager.getSubscription();
    if(!subscription){subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:enocUrlBase64ToUint8Array(config.publicKey)});}
    const saveRes=await fetch(SUPABASE_URL+'/functions/v1/enoc-push-subscribe',{method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(subscription.toJSON())});
    const saved=await saveRes.json();
    if(!saveRes.ok||!saved.ok)throw new Error(saved.error||'No se pudo guardar la suscripción');
    label('✅ Push activado'); const notice=document.getElementById('enocPushNotice'); if(notice)notice.hidden=true; if(btn)btn.title='Este dispositivo está registrado para recibir avisos de pedidos';
    return true;
  }catch(e){console.error('ENOC push setup:',e);label('⚠️ Reintentar push');if(typeof toast==='function')toast('No se pudo activar push: '+(e.message||e),false);return false;}
}

async function init(){
  buildNav();
  const {data:{session}}=await db.auth.getSession();
  if(!session){sessionStorage.removeItem("enoc_admin_session");location.replace(LOGIN_URL);return}
  $("who").textContent=session.user?.email||"ENOC STORE";
  const pushBtn=document.getElementById("enocPushBtn");
  const pushNotice=document.getElementById("enocPushNotice");
  const pushNoticeBtn=document.getElementById("enocPushNoticeBtn");
  if(pushBtn) pushBtn.addEventListener("click",()=>setupENOCPush(session,true));
  if(pushBtn && ("Notification" in window) && Notification.permission==="granted") { pushBtn.textContent="🔔 Registrar este dispositivo"; }
  if(pushNoticeBtn && pushBtn) pushNoticeBtn.addEventListener("click",()=>pushBtn.click());
  if(pushNotice) {
    pushNotice.hidden=false;
    if(("Notification" in window) && Notification.permission==="granted") {
      const title=pushNotice.querySelector("strong"), copy=pushNotice.querySelector("span"), action=document.getElementById("enocPushNoticeBtn");
      if(title) title.textContent="Registra este dispositivo";
      if(copy) copy.textContent="Permite que ENOC envíe avisos de nuevos pedidos aquí.";
      if(action) action.textContent="Registrar";
    } else if(("Notification" in window) && Notification.permission==="denied") {
      const title=pushNotice.querySelector("strong"), copy=pushNotice.querySelector("span"), action=document.getElementById("enocPushNoticeBtn");
      if(title) title.textContent="Notificaciones bloqueadas";
      if(copy) copy.textContent="Permite las notificaciones desde los ajustes del navegador o de la app instalada.";
      if(action) action.textContent="Reintentar";
    }
  }
  $("out").onclick=()=>{sessionStorage.removeItem("enoc_admin_session");db.auth.signOut().finally(()=>location.replace(LOGIN_URL))};
  $("q").addEventListener("input",filterMods);
  window.addEventListener("hashchange",render);
  render();
}
init().catch(e=>{$("view").innerHTML=`<div class="banner err">No se pudo iniciar el panel: ${esc(e.message)}</div>`});

<script>
/* Cotizador de mercancía: persistencia local en este navegador; no modifica inventario ni compras de producción. */
const ENOC_QUOTE_STORE='enoc_merchandise_quotes_v1';
let quoteLines=[],quotePayments=[],quoteEditingId=null;
const qv=id=>document.getElementById(id);
const qnum=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const qmoney=n=>new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number.isFinite(n)?n:0);
const qusd=n=>'$'+qmoney(n);
function qloadAll(){try{const a=JSON.parse(localStorage.getItem(ENOC_QUOTE_STORE)||'[]');return Array.isArray(a)?a:[]}catch{return []}}
function qsaveAll(a){localStorage.setItem(ENOC_QUOTE_STORE,JSON.stringify(a))}
function qcurrencyRate(){return Math.max(.0000001,qnum(qv('qCurrencyRate')?.value)||1)}
function qoriginCurrency(){return qv('qCurrency')?.value||'USD'}
function qlinePurchase(l){return l.qty*l.unitCost/qcurrencyRate()}
function qcalc(){
 const lines=quoteLines,qty=lines.reduce((a,l)=>a+l.qty,0),purchase=lines.reduce((a,l)=>a+qlinePurchase(l),0);
 const transport=qnum(qv('qTransport')?.value),customs=qnum(qv('qCustoms')?.value),commission=qnum(qv('qCommission')?.value),packing=qnum(qv('qPacking')?.value),other=qnum(qv('qOther')?.value);
 const shared=transport+customs+commission+packing+other;
 const method=qv('qAllocation')?.value||'value';
 const weights=lines.map(l=>method==='units'?l.qty:method==='weight'?l.qty*l.weight:qlinePurchase(l));
 const denom=weights.reduce((a,b)=>a+b,0);
 const results=lines.map((l,i)=>{const base=qlinePurchase(l),allocated=denom>0?shared*weights[i]/denom:0,total=base+allocated,unit=l.qty>0?total/l.qty:0;return {...l,base,allocated,total,unit,weightTotal:l.qty*l.weight}});
 const totalCost=purchase+shared,rateBCV=qnum(qv('qBcvRate')?.value),markup=Math.max(0,qnum(qv('qTarget')?.value)),pricing=qv('qPricingMode')?.value||'markup';
 const paid=quotePayments.reduce((a,p)=>a+p.amountUSD,0),balance=Math.max(0,totalCost-paid);
 const margin=pricing==='margin'?Math.min(99.99,markup):null;
 results.forEach(r=>{if(pricing==='margin'){r.priceBase=r.unit/(1-margin/100)}else{r.priceBase=r.unit*(1+markup/100)}r.priceFinal=r.priceBase*1.16;r.profit=r.priceBase-r.unit;r.realMargin=r.priceBase>0?r.profit/r.priceBase*100:0;r.priceBs=rateBCV>0?r.priceFinal*rateBCV:0;});
 return {results,qty,purchase,shared,totalCost,paid,balance,rateBCV,markup,pricing,transport,customs,commission,packing,other};
}
function qrenderLines(){const body=qv('qLinesBody');if(!body)return;body.innerHTML=quoteLines.map((l,i)=>`<tr><td><input data-ql="name" data-i="${i}" value="${esc(l.name)}" placeholder="Nombre / referencia"></td><td><input data-ql="qty" data-i="${i}" type="number" min="1" step="1" value="${l.qty}"></td><td><input data-ql="unitCost" data-i="${i}" type="number" min="0" step="0.01" value="${l.unitCost}"></td><td><input data-ql="weight" data-i="${i}" type="number" min="0" step="0.01" value="${l.weight}" title="Peso o volumen por unidad para repartir gastos"></td><td><span id="qLineTotal${i}">—</span></td><td><button class="quote-btn danger" type="button" data-qremove="${i}" aria-label="Eliminar artículo">×</button></td></tr>`).join('')||'<tr><td colspan="6" class="quote-empty">Agrega los artículos que quieres cotizar.</td></tr>';qrenderResults()}
function qrenderResults(){const c=qcalc();const body=qv('qLineResults');if(body)body.innerHTML=c.results.map((r,i)=>`<tr><td><b>${esc(r.name||'Artículo '+(i+1))}</b></td><td>${qmoney(r.qty)}</td><td>${qusd(r.unit)}</td><td>${qusd(r.allocated)}</td><td><b>${qusd(r.priceFinal)}</b></td><td>${qmoney(r.realMargin)}%</td><td>${c.rateBCV>0?'Bs. '+qmoney(r.priceBs):'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="quote-empty">Sin artículos.</td></tr>';
 const set=(id,val)=>{const e=qv(id);if(e)e.textContent=val};set('qPurchaseTotal',qusd(c.purchase));set('qSharedTotal',qusd(c.shared));set('qGrandTotal',qusd(c.totalCost));set('qUnitCount',qmoney(c.qty));set('qPaidTotal',qusd(c.paid));set('qBalance',qusd(c.balance));set('qBcvTotal',c.rateBCV>0?'Bs. '+qmoney(c.totalCost*c.rateBCV):'—');set('qCostPriceTotal',qusd(c.results.reduce((a,r)=>a+r.priceFinal*r.qty,0)));set('qProfitTotal',qusd(c.results.reduce((a,r)=>a+r.profit*r.qty,0)));const preTaxSales=c.results.reduce((a,r)=>a+r.priceBase*r.qty,0),totalProfit=c.results.reduce((a,r)=>a+r.profit*r.qty,0);set('qProfitMargin',preTaxSales>0?qmoney(totalProfit/preTaxSales*100)+'%':'—');c.results.forEach((r,i)=>{const cell=qv('qLineTotal'+i);if(cell)cell.textContent=qusd(r.base)});set('qSupplierCurrencyLabel',qoriginCurrency());
 const saved=qv('qSavedPayments');if(saved)saved.innerHTML=quotePayments.map((p,i)=>`<tr><td>${esc(p.date)}</td><td>${qusd(p.amountUSD)}</td><td>${esc(p.reference||'—')}</td><td><button class="quote-btn danger" type="button" data-qpayremove="${i}">Quitar</button></td></tr>`).join('')||'<tr><td colspan="4" class="quote-empty">No hay abonos registrados.</td></tr>';
}

<script>
/* Optimización de imágenes de prueba: solo afecta a nuevas subidas desde esta copia. */
async function compressImageBeforeUpload(file, options = {}) {
  if (!file || !/^image\/(jpeg|png|webp)$/.test(file.type || "")) return file;
  try {
    const maxDimension = options.maxDimension || 1800, quality = options.quality || 0.84;
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
    const width = Math.max(1, Math.round(bitmap.width * scale)), height = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement("canvas"); canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext("2d", { alpha: true });
    if (!ctx) { bitmap.close?.(); return file; }
    ctx.drawImage(bitmap, 0, 0, width, height); bitmap.close?.();
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/webp", quality));
    if (!blob || blob.size >= file.size * 0.9) return file;
    const base = (file.name || "imagen").replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9._-]/g, "-") || "imagen";
    const optimized = new File([blob], base + ".webp", { type: "image/webp", lastModified: Date.now() });
    console.info("[ENOC imagen]", file.name, file.size, "->", optimized.size, "bytes");
    return optimized;
  } catch (error) {
    console.warn("[ENOC imagen] No se pudo optimizar; se subirá el original.", error);
    return file;
  }
}
</script>
